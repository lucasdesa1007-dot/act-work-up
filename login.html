<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5101D4">
  <title>Login — act Work&amp;Up</title>
  <meta name="description" content="act Work&amp;Up — serviços em Indaiatuba e região.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
  <div id="app">

<section class="screen auth-screen active" id="login" aria-label="Login">
      <div class="auth-card">
        <a class="auth-brand" href="/login">
          <img src="assets/logo-wolfservices.jpg" alt="">
          <span>
            act Work&amp;Up
          </span>
        </a>
        <div class="auth-tabs">
          <button class="tab active" type="button">
            Login
          </button>
          <a href="/login" class="tab">
            Cadastro
          </a>
        </div>
        <p class="eyebrow">
          Que bom ter você de volta
        </p>
        <h1>
          Acesse sua conta
        </h1>
        <p class="muted">
          Entre com seu email e senha para continuar.
        </p>
        <form class="form-stack" data-local-form>
          <label>
            Email
            <input type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
          </label>
          <label>
            Senha
            <input type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
          </label>
          <button class="text-action" type="button">
            Esqueceu sua senha?
          </button>
          <a href="/inicio" class="btn primary full">
            Entrar
          </a>
        </form>
        <p class="auth-foot">
          Ainda não tem conta?
          <a href="/login" class="inline-action">
            Cadastre-se
          </a>
        </p>
      </div>
    </section>

  </div>
  <script src="/script.js?v=5"></script>
</body>
</html>
