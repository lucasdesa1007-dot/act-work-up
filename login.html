<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5101D4">
  <title>Login — act Work&amp;Up</title>
  <meta name="description" content="act Work&amp;Up — serviços em Indaiatuba e região.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div id="app">

<section class="screen auth-screen active" id="login" aria-label="Login">
      <div class="auth-card">
        <a class="auth-brand" href="login.html">
          <img src="assets/logo-wolfservices.jpg" alt="">
          <span>
            act Work&amp;Up
          </span>
        </a>
        <div class="auth-tabs">
          <button class="tab active" type="button">
            Login
          </button>
          <a href="cadastro-tipo.html" class="tab">
            Cadastro
          </a>
        </div>
        <p class="eyebrow">
          Que bom ter você de volta
        </p>
        <h1>
          Acesse sua conta
        </h1>
        <p class="muted">
          Entre com seu email e senha para continuar.
        </p>
        <form class="form-stack" data-local-form>
          <label>
            Entrar como
            <select name="account-type">
              <option value="common">Usuário comum</option>
              <option value="provider">Prestador de serviços</option>
            </select>
          </label>
          <label>
            Email
            <input name="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
          </label>
          <label>
            Senha
            <input type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
          </label>
          <button class="text-action" type="button" data-demo-message="password-help" data-message="A recuperação de senha não está habilitada nesta demonstração.">
            Esqueceu sua senha?
          </button>
          <p class="form-feedback" id="password-help" role="status" aria-live="polite"></p>
          <button type="submit" class="btn primary full" data-screen="inicio">
            Entrar
          </button>
        </form>
        <p class="auth-foot">
          Ainda não tem conta?
          <a href="cadastro-tipo.html" class="inline-action">
            Cadastre-se
          </a>
        </p>
      </div>
    </section>

  </div>
  <script src="script.js?v=9"></script>
</body>
</html>
